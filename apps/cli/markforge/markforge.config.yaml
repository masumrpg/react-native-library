to:
  - docx
  - pdf
  - html
outputDir: ".temp/output-yaml"
theme: "academic"
orientation: "portrait"
paperSize: "A4"
margins:
  top: "2.5cm"
  bottom: "2.5cm"
  left: "3cm"
  right: "3cm"
header:
  left: "Research Group"
  right: "{title}"
footer:
  left: "Draft Report"
  right: "Page {page} of {pages}"
toc: true
embedImages: true
