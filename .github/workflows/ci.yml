name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-audit:
    name: Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Monorepo Packages
        run: bun run build

      - name: Run TsCheck Package Test Suite & Coverage
        run: bun run --cwd packages/tscheck test:coverage

      - name: Run Monorepo AST Audit
        run: bun run audit --format github --fail-on-warning
